name: Update profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: '23 13 * * *'

permissions:
  contents: write

concurrency: profile-stats

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch public GitHub stats
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: |
          gh api "users/$PROFILE_USER" > "$RUNNER_TEMP/profile-user.json"
          gh api --paginate --slurp \
            "users/$PROFILE_USER/repos?type=owner&per_page=100" \
            > "$RUNNER_TEMP/profile-repos.json"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          temp = Path(os.environ["RUNNER_TEMP"])
          user = json.loads((temp / "profile-user.json").read_text())
          pages = json.loads((temp / "profile-repos.json").read_text())
          stars = sum(
              repo["stargazers_count"]
              for page in pages
              for repo in page
              if not repo["private"]
          )

          stats = (
              f'Public repos: {user["public_repos"]:,}  ·  '
              f'Followers: {user["followers"]:,}  ·  '
              f'Stars earned: {stars:,}'
          )

          card = Path("profile.svg")
          updated, count = re.subn(
              r"(?<=<!-- stats:start -->).*?(?=<!-- stats:end -->)",
              stats,
              card.read_text(encoding="utf-8"),
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit("Expected one stats row in profile.svg")
          card.write_text(updated, encoding="utf-8")
          PY

      - name: Commit updated stats
        run: |
          if git diff --quiet -- profile.svg; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile.svg
          git commit -m "Update public GitHub stats"
          git push
